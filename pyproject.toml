[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reportmaker"
version = "0.1.0"
description = "Dynamic Report Generator – PDF, HTML, Excel"
readme = "README.md"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.5.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "S"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
warn_return_any = true

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src"]
known_first_party = ["reportmaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
